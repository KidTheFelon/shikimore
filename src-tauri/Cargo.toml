[package]
name = "shikimore"
version = "0.1.0"
description = "Shikimore - приложение для работы с Shikimori API"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-deep-link = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shikicrate = { path = "../shikicrate" }
reqwest = { version = "0.13", features = ["json", "rustls", "query", "multipart"] }
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
log = "0.4"
flexi_logger = "0.31"
urlencoding = "2.1"
tokio = { version = "1", features = ["time"] }
dotenv = "0.15"
thiserror = "2.0"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 0
debug = false
incremental = true
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
